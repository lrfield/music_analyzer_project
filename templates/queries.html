<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Music Analyzer Queries</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>

<header>
  <h1>Music Analyzer</h1>
</header>

<nav>
    <a class="nav-btn" href="/">Home</a>
    <a class="nav-btn" href="/report">Report</a>
    <a class="nav-btn" href="/queries">Queries</a>
    <a class="nav-btn" href="/visualization">Visualization</a>
</nav>

<main>
  <div class="card">
    <h2>Multiply</h2>
    <div class="child_card">
      <form method="POST">
        <input type="text" name="operand_a" placeholder="First number">
        <input type="text" name="operand_b" placeholder="Second number">
        <button type="submit">Calculate</button>
      </form>
    </div>

    {% if error %}
    <div class="child_card">
      <p>Error: {{ error }}</p>
    </div>
    {% endif %}

    {% if result is not none %}
    <div class="child_card">
      <p>Result: {{ result }}</p>
    </div>
    {% endif %}

  </div>
</main>

<footer id="main-footer">Footer</footer>

</body>
</html>
